<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เข้าสู่ระบบ — EKG / Out Lab</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="#0b6bcb"/>
          <!-- EKG wave icon -->
          <polyline points="4,24 12,24 16,14 20,34 24,20 28,28 32,24 44,24"
            fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>EKG / Out Lab</h1>
      <p class="subtitle">เข้าสู่ระบบด้วย Username HOSxP</p>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text"
            autocomplete="username" autocapitalize="none"
            placeholder="Username HOSxP ของคุณ" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password"
              autocomplete="current-password"
              placeholder="รหัสผ่าน" required />
            <button type="button" id="togglePw" aria-label="แสดง/ซ่อนรหัสผ่าน" tabindex="-1">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <p id="loginErr" class="error" role="alert" aria-live="polite"></p>

        <button type="submit" id="btnLogin" class="btn-primary">
          <span id="btnText">เข้าสู่ระบบ</span>
          <span id="btnSpinner" class="spinner hidden" aria-hidden="true"></span>
        </button>
      </form>

      <p class="footer-note" id="authModeNote"></p>
    </div>
  </div>

  <script>
    // แสดง/ซ่อนรหัสผ่าน
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    // ดึง auth mode จาก server
    fetch('/api/auth/info').then(r => r.json()).then(d => {
      const note = document.getElementById('authModeNote');
      if (d.mode === 'hosxp') note.textContent = 'ใช้ Username/Password เดียวกับ HOSxP';
      else if (d.mode === 'both') note.textContent = 'ล็อกอินด้วย HOSxP หรือบัญชีระบบ';
      else note.textContent = 'ล็อกอินด้วยบัญชีระบบ';
    }).catch(() => {});

    // Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errEl = document.getElementById('loginErr');
      const spinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errEl.textContent = '';
      btn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.textContent = 'กำลังตรวจสอบ...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (res.ok) {
          // redirect ไปหน้าหลัก (หรือหน้าที่ตั้งใจไป)
          const next = new URLSearchParams(location.search).get('next') || '/';
          location.href = next;
        } else {
          errEl.textContent = data.error || 'Username หรือ Password ไม่ถูกต้อง';
        }
      } catch {
        errEl.textContent = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
        btnText.textContent = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
